[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "hero"
dynamic = ["version"]
description = "HERO: HiErarchical, length-RObust machine-influenced text detector"
readme = {text = "HERO - fine-grained machine-influenced text detection", content-type = "text/plain"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40,<5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scikit-learn",
    "numpy",
    "tqdm",
    "loguru",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "isort"]

[tool.setuptools]
package-dir = {"hero" = "."}
packages = [
    "hero",
    "hero.data",
    "hero.data_process",
    "hero.losses",
    "hero.modules",
    "hero.trainer",
    "hero.utils",
]

[tool.setuptools.package-data]
hero = ["config/**/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "hero.version.VERSION"}
